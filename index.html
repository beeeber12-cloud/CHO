<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 가 있어야 iOS 홈 인디케이터 영역(safe-area-inset)을 CSS에서 읽을 수 있음 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>말씀나눔 - 성경 묵상 공유</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14603F" />

    <!-- 브라우저 탭/즐겨찾기 아이콘 -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS 홈화면 설치 아이콘 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="말씀나눔" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('Service Worker registered successfully:', reg.scope);
              // 앱을 열 때마다 새 버전이 있는지 확인한다
              reg.update().catch(() => {});
            })
            .catch(err => console.error('Service Worker registration failed:', err));
        });

        // 새 버전이 적용되면 화면을 한 번 자동으로 새로 고친다.
        // 어르신들이 '껐다 켜기'를 여러 번 하지 않아도 업데이트가 바로 보이게 한다.
        var __reloadedForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (__reloadedForUpdate) return;   // 새로고침이 반복되지 않도록
          __reloadedForUpdate = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
